<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#04080f">
<meta name="description" content="Vayu Flappy Bird — endless flap through neon pipes.">
<title>Flappy Bird — Vayu</title>
<link rel="icon" type="image/png" href="/Vayu_Fav.png">
<link rel="apple-touch-icon" type="image/png" href="/Vayu_Fav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

<body data-vayu-defer data-page="flappybird">
<main id="top">
